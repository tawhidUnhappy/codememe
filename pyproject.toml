[project]
name = "codememe"
version = "0.1.0"
description = "Learn a programming language by meme: a whole course of vertical Shorts, planned and written by an LLM, checked and rendered locally"
requires-python = ">=3.10"
dependencies = ["pillow>=10.4.0", "pygments>=2.18"]

[project.scripts]
codememe = "codememe.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 165

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
